<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Copiar comentario y abrir publicación</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f4f1ea;color:#14213d}
main{max-width:560px;margin:auto;padding:24px 18px}
h1{font-size:20px;margin:0 0 12px}
.com{background:#fff;border-left:5px solid #0a66c2;border-radius:8px;padding:14px;font-size:17px;line-height:1.45;white-space:pre-wrap;margin:0 0 18px}
button{width:100%;background:#0a66c2;color:#fff;border:0;border-radius:12px;padding:18px;font-size:19px;font-weight:700}
.ok{color:#1b7f3b;font-weight:700;margin:12px 0;min-height:24px}
small{color:#666;display:block;margin-top:14px}
</style></head><body><main>
<h1>Comentario sugerido</h1>
<div id="com" class="com"></div>
<button id="b">Copiar comentario y abrir la publicación</button>
<div id="ok" class="ok"></div>
<small>Al abrir la publicación, pulsa en «Añade un comentario…», mantén pulsado y elige «Pegar». Puedes cambiar el texto a tu gusto antes de enviarlo.</small>
</main>
<script>
(function(){
  var h=new URLSearchParams(location.hash.slice(1)), post=h.get("p")||"", txt=h.get("t")||"";
  if(!/^https:\/\/www\.instagram\.com\//.test(post)){document.getElementById("com").textContent="Enlace no válido.";document.getElementById("b").style.display="none";return;}
  document.getElementById("com").textContent=txt;
  function copiar(){
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt).then(function(){return true}).catch(function(){return viejo()});}
    return Promise.resolve(viejo());
  }
  function viejo(){try{var t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.focus();t.select();var r=document.execCommand("copy");document.body.removeChild(t);return r}catch(e){return false}}
  function ir(){copiar().then(function(ok){document.getElementById("ok").textContent=ok?"✅ Comentario copiado. Abriendo la publicación…":"No se pudo copiar solo: mantén pulsado el texto de arriba y copia. Abriendo…";setTimeout(function(){location.href=post},ok?700:2500)})}
  document.getElementById("b").addEventListener("click",ir);
  // intento automático (algunos navegadores lo permiten sin toque); si falla, queda el botón
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){document.getElementById("ok").textContent="✅ Comentario copiado. Abriendo la publicación…";setTimeout(function(){location.href=post},1200)}).catch(function(){})}
})();
</script></body></html>
