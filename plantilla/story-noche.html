<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="estilos.css"><script src="comun.js"></script>
<style>
.lienzo{background:linear-gradient(180deg,#050F1E 0%,#0B2A4A 70%,#123E6B 100%)}
.lienzo::before{content:"";position:absolute;right:-120px;top:120px;width:360px;height:360px;border-radius:50%;background:var(--c-acento);opacity:.9}
.zona{position:absolute;left:70px;right:70px;top:250px;bottom:250px;display:flex;flex-direction:column;gap:26px}
.marca{font-size:30px}
h1{font-family:var(--f-titulo);font-weight:900;font-size:88px;line-height:1;margin-bottom:6px}
.sub{font-size:34px;color:var(--c-suave);font-weight:600;margin-bottom:10px}
.lista{flex:1;display:flex;flex-direction:column;gap:24px;min-height:0}
.ev{flex:1;min-height:0;display:flex;gap:28px;background:var(--c-tarjeta);border:2px solid var(--c-linea);border-radius:30px;padding:18px}
.ev .foto{flex:none;height:100%;aspect-ratio:1/1;border-radius:22px}
.ev .txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.ev h2{font-family:var(--f-titulo);font-size:40px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.ev .hora{font-size:38px;font-weight:900;color:var(--c-acento)}
.ev .meta{font-size:30px;color:var(--c-suave);font-weight:600}
</style></head><body>
<div class="lienzo story" id="l"></div>
<script>
async function render(d){
  document.getElementById("l").innerHTML=`<div class="zona">
    <div class="marca">Agenda Cádiz</div><h1>Esta noche en Cádiz</h1>
    <div class="sub">${esc(d.fecha_larga)}${d.total_paginas>1?` · ${d.pagina}/${d.total_paginas}`:""}</div>
    <div class="lista">${d.eventos.map(ev=>`<div class="ev"><div class="foto" style="background-image:${foto(ev)}" role="img" aria-label="${esc(ev.imagen&&ev.imagen.alt_text)}"></div>
      <div class="txt"><div class="hora">${esc(horaTxt(ev))}</div><h2 class="clamp2">${esc(ev.nombre)}</h2><div class="meta clamp2">${esc(ev.lugar)} · ${esc(precioTxt(ev))}</div></div></div>`).join("")}</div>
  </div>`;
  await listo();
}
</script></body></html>
