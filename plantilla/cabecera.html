<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="estilos.css"><script src="comun.js"></script>
<style>
body{margin:0;background:#083F6B}
/* 1640x624 (2x de 820x312). Zona segura móvil: x 265–1375 (centro). Foto de perfil en escritorio tapa abajo-izquierda. */
.cab{width:1640px;height:624px;position:relative;overflow:hidden;background:linear-gradient(170deg,#0A5A94 0%,#083F6B 100%);color:#fff}
.sol{position:absolute;width:300px;height:300px;border-radius:50%;background:#FFC62B;right:300px;top:-90px}
.ola{position:absolute;left:-40px;right:-40px;height:60px;opacity:.5}
.ola svg{width:100%;height:100%}
.centro{position:absolute;left:265px;width:1110px;top:150px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cab .logo{align-items:center}
.cab .logo .pre{color:#FFC62B;font-size:.24em}
.cab .logo .ciudad{color:#fff}
.lema{margin-top:26px;font:600 40px var(--f-texto);color:#fff;letter-spacing:.01em}
.lema b{color:#FFC62B;font-weight:800}
</style></head><body>
<div class="cab" id="c"></div>
<script>
function olas(top,op){return `<div class="ola" style="top:${top}px;opacity:${op}"><svg viewBox="0 0 1700 60" preserveAspectRatio="none"><path d="M0 30q42-30 85 0t85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0 85 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></div>`}
async function render(d){
  aplicarTema(d);
  document.getElementById("c").innerHTML=`<div class="sol"></div>${olas(470,.35)}${olas(530,.5)}${olas(580,.25)}
  <div class="centro">${logo(d,"",190)}<div class="lema">Qué hacer hoy en Cádiz · <b>cada día a las 9:00</b></div></div>`;
  await listo();
}
</script></body></html>
