<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="estilos.css"><script src="comun.js"></script>
<style>
.lienzo{padding:84px 80px 76px;display:flex;flex-direction:column;justify-content:space-between}
.cab{display:flex;justify-content:space-between;align-items:flex-start}
.tag{margin-bottom:22px;font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-suave)}
h1{font-size:104px;line-height:1.0;letter-spacing:-.02em;overflow-wrap:anywhere;color:var(--c-texto)}
h1.largo{font-size:88px}
.fecha{margin-top:28px;font-size:52px;font-weight:700;color:var(--c-dato-portada,var(--c-acento))}
.total{display:flex;align-items:center;gap:28px}
.total b{font-family:var(--f-titulo);font-size:190px;font-weight:var(--peso-t);line-height:1;color:var(--c-dato-portada,var(--c-acento))}
.total span{font-size:46px;font-weight:700;line-height:1.15}
.pie{display:flex;justify-content:space-between;font-size:32px;color:var(--c-suave);font-weight:600}
</style></head><body>
<div class="lienzo feed" id="l"></div>
<script>
async function render(d){
  aplicarTema(d);
  const L=document.getElementById("l");L.classList.add("portada");if(d.vertical){L.classList.remove("feed");L.classList.add("story");}const n=d.total, t=d.titulo||"Qué hacer hoy";
  document.getElementById("l").innerHTML=`<div class="deco"></div>
  <div class="cab">${logo(d,"",d.tam_logo||190)}</div>
  <div><div class="tag">${esc(d.etiqueta||"")}</div><h1 class="titulo ${t.length>24?'largo':''}">${esc(t)}</h1><div class="fecha">${esc((d.subtitulo||"").replace(/^./,c=>c.toUpperCase()))}</div></div>
  <div class="total"><b>${n}</b><span>${n===1?"plan":"planes"}<br>${esc(d.sufijo||"en la ciudad")}</span></div>
  <div class="pie"><span>Guarda este post</span><span>Desliza →</span></div>`;
  document.querySelector(".cab .logo").dataset.max=760; ajustar(760); await listo();
}
</script></body></html>
