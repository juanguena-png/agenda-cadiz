<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="estilos.css"><script src="comun.js"></script>
<style>
/* Zonas libres: 250px arriba y abajo. Todo el texto va dentro de .zona */
.lienzo{background:var(--c-fondo)}
.fondo{position:absolute;inset:-40px;filter:blur(38px) brightness(.45);transform:scale(1.1)}
.zona{position:absolute;left:70px;right:70px;top:250px;bottom:250px;display:flex;flex-direction:column;gap:22px}
.zona .foto{flex:none;height:560px;border-radius:36px;border:3px solid var(--c-linea)}
.fila{display:flex;gap:12px;flex-wrap:wrap}
.chip{font-size:28px}
h1{font-family:var(--f-titulo);font-weight:900;font-size:64px;line-height:1.06;overflow-wrap:anywhere}
.dato{font-size:36px;font-weight:700;line-height:1.2}
.dato small{display:block;font-size:30px;font-weight:500;color:var(--c-suave)}
.dato.h{color:var(--c-acento)}
.desc{font-size:34px;line-height:1.28;color:var(--c-texto)}
.info{margin-top:auto;font-size:32px;font-weight:700;color:var(--c-acento-2)}
</style></head><body>
<div class="lienzo story" id="l"></div>
<script>
async function render(d){
  const ev=d.evento;
  const dir=ev.direccion?`<small class="clamp1">${esc(ev.direccion)}</small>`:"";
  const fin=ev.hora_fin?` a ${esc(ev.hora_fin)}`:"";
  const hora=(ev.todo_el_dia||!ev.hora_inicio)?"Todo el día":`${esc(ev.hora_inicio)}${fin}`;
  document.getElementById("l").innerHTML=`<div class="fondo foto" style="background-image:${foto(ev)}"></div>
  <div class="zona">
    <div class="foto" style="background-image:${foto(ev)}" role="img" aria-label="${esc(ev.imagen&&ev.imagen.alt_text)}"></div>
    <div class="fila"><span class="chip">${esc(ev.categoria)}</span><span class="chip alt">${esc(ev.publico||"Todos los públicos")}</span></div>
    <h1 class="clamp3">${esc(ev.nombre)}</h1>
    <div class="dato h">${esc(d.fecha_larga)} · ${hora}</div>
    <div class="dato clamp2">${esc(ev.lugar)}${dir}</div>
    <div class="dato">${esc(precioTxt(ev))}</div>
    <div class="desc clamp3">${esc(ev.descripcion||"")}</div>
    <div class="info clamp2">${esc(ev.info||"")}</div>
  </div>`;
  await listo();
}
</script></body></html>
